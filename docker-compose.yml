# notten-home — single Spring Boot service (no database).
#
# Local build & run:
#   docker compose up -d --build
#
# Pull the CI-published image instead of building:
#   docker compose pull && docker compose up -d

services:
  app:
    image: "${NOTTEN_HOME_IMAGE:-ghcr.io/shlee-dev012/notten_home:latest}"
    build: .
    ports:
      - "8080:8080"
    environment:
      # Cap the heap for small hosts; override as needed.
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
