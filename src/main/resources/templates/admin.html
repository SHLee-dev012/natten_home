<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 검색엔진에 걸리지 않게 한다. robots.txt 와 짝이다. -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>관리자 · 낯선대학 10주년 축제</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" href="/img/favicon.svg" type="image/svg+xml">

    <!-- 홈화면에 추가하면 앱처럼 열린다. 공개 사이트에는 이 페이지로 가는
         링크를 두지 않으므로, 아는 사람만 아이콘으로 바로 들어온다.
         경로를 상대로 적어야 루트에서도 하위 경로에서도 같은 자리를 가리킨다. -->
    <link rel="manifest" href="admin/manifest.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <!-- iOS 는 매니페스트만으로는 부족해 애플 전용 표시를 함께 둔다.
         apple-touch-icon 이 없으면 홈화면에 페이지 축소본이 박힌다. -->
    <link rel="apple-touch-icon" href="admin/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="명단 조회">

    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body>

<main class="wrap">

    <!-- 로그인 -->
    <section class="gate" id="gate">
        <span class="kicker">RESTRICTED</span>
        <h1>관리자 열람</h1>
        <p class="lead">등록된 관리자 계정으로 로그인하세요.</p>

        <form id="gate-form" autocomplete="off">
            <label class="field">
                <span class="field-k">아이디</span>
                <input type="text" id="gate-email" name="username" value="admin"
                       autocomplete="username" autocapitalize="off"
                       autocorrect="off" spellcheck="false" required>
            </label>
            <label class="field">
                <span class="field-k">비밀번호</span>
                <input type="password" id="gate-pass" name="password"
                       autocomplete="current-password" required
                       aria-describedby="gate-msg">
            </label>
            <button class="btn" type="submit" id="gate-go">로그인</button>
        </form>

        <p class="msg" id="gate-msg" role="status" aria-live="polite"></p>

        <p class="fineprint">
            후원자 명단은 이 페이지에 실려 있지 않습니다. 로그인해서 받은 토큰으로
            데이터베이스에 물어보고, 권한 판단은 서버가 합니다 — 권한이 없으면
            서버가 아예 내주지 않습니다. 토큰은 이 탭의 메모리에만 있어
            새로고침하거나 탭을 닫으면 사라집니다.
        </p>
    </section>

    <!-- 열린 뒤 -->
    <section class="vault" id="vault" hidden>
        <!-- 잠기기 30초 전부터 뜬다. 접수 중에 갑자기 잠기면 당황하므로
             미리 알리고, 계속 보기를 누르면 시간이 다시 채워진다. -->
        <p class="idle" id="idle" role="status" aria-live="polite" hidden>
            사용이 없어 <b id="idle-left">30</b>초 뒤 잠깁니다.
            <button class="btn btn-ghost" type="button">계속 보기</button>
        </p>

        <div class="vault-head">
            <div>
                <h1>후원자 명단</h1>
                <p class="lead" id="who"></p>
            </div>
            <div class="vault-actions">
                <button class="btn btn-ghost" type="button" id="reload"
                        title="데이터베이스에서 명단을 다시 받아옵니다 (로그아웃하지 않음)">다시 불러오기</button>
                <button class="btn btn-ghost" type="button" id="lock">로그아웃</button>
            </div>
        </div>

        <!-- 검색은 폼이다. 폼이라야 휴대폰 키보드에 '검색' 키가 뜨고, 누르면
             키보드가 닫히면서 결과가 보인다. 데스크톱에서는 치는 대로 걸러진다. -->
        <form class="tools" id="find-form" autocomplete="off">
            <label class="field field-inline">
                <!-- '검색' 글자를 빼고 자리를 입력칸에 넘긴다. 무엇을 넣는
                     칸인지는 안내글이 이미 말해준다. 다만 보이는 이름이
                     사라지면 스크린리더가 읽을 것이 없어 aria-label 로 남긴다. -->
                <input type="search" id="q" name="q" enterkeyhint="search"
                       aria-label="후원자 검색"
                       placeholder="이름 또는 전화 뒤 4자리"
                       autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
            </label>
            <button class="btn" type="submit" id="find">조회</button>
            <span class="count" id="count"></span>
        </form>

        <!-- 금고 안에서 나는 말(체크인 실패 등). 로그인 화면의 gate-msg 는
             금고가 열리면 함께 숨으므로 여기 따로 둔다. -->
        <p class="msg" id="vault-msg" role="status" aria-live="polite"></p>

        <div class="table-scroll">
            <table class="roster" id="roster">
                <thead><tr id="thead-row"></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        <p class="fineprint" id="fetched"></p>
    </section>

</main>

<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
