<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 검색엔진에 걸리지 않게 한다. robots.txt 와 짝이다. -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>관리자 · 낯선대학 10주년 축제</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body>

<main class="wrap">

    <!-- 로그인 -->
    <section class="gate" id="gate">
        <span class="kicker">RESTRICTED</span>
        <h1>관리자 열람</h1>
        <p class="lead">등록된 관리자 계정으로 로그인하세요.</p>

        <form id="gate-form" autocomplete="off">
            <label class="field">
                <span class="field-k">이메일</span>
                <input type="email" id="gate-email" name="email"
                       autocomplete="username" autocapitalize="off"
                       autocorrect="off" spellcheck="false" required>
            </label>
            <label class="field">
                <span class="field-k">비밀번호</span>
                <input type="password" id="gate-pass" name="password"
                       autocomplete="current-password" required
                       aria-describedby="gate-msg">
            </label>
            <button class="btn" type="submit" id="gate-go">로그인</button>
        </form>

        <p class="msg" id="gate-msg" role="status" aria-live="polite"></p>

        <p class="fineprint">
            명단은 이 페이지에 실려 있지 않습니다. 로그인해서 받은 토큰으로
            데이터베이스에 물어보고, 권한 판단은 서버가 합니다 — 권한이 없으면
            서버가 아예 내주지 않습니다. 토큰은 이 탭의 메모리에만 있어
            새로고침하거나 탭을 닫으면 사라집니다.
        </p>
    </section>

    <!-- 열린 뒤 -->
    <section class="vault" id="vault" hidden>
        <div class="vault-head">
            <div>
                <h1>명단</h1>
                <p class="lead" id="who"></p>
            </div>
            <button class="btn btn-ghost" type="button" id="lock">로그아웃</button>
        </div>

        <div class="tools">
            <label class="field field-inline">
                <span class="field-k">검색</span>
                <input type="search" id="q" placeholder="이름·기수·구분" autocomplete="off">
            </label>
            <span class="count" id="count"></span>
            <button class="btn btn-ghost" type="button" id="reload">새로 받기</button>
        </div>

        <div class="table-scroll">
            <table class="roster" id="roster">
                <thead><tr id="thead-row"></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        <p class="fineprint" id="fetched"></p>
    </section>

</main>

<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
