<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Time × zone matrix for one festival day. -->
<div th:fragment="matrix(columns, hours, day)" class="matrix-scroll daypanel"
     th:classappend="'daypanel-' + ${day}">
    <div class="matrix"
         th:style="'grid-template-columns: var(--mx-time) repeat(' + ${#lists.size(columns)} + ', minmax(148px, 1fr));'">
        <!-- corner -->
        <div class="mx-corner"></div>
        <!-- zone headers -->
        <div class="mx-head" th:each="c,ci : ${columns}" th:attr="data-cat=${c.category()}"
             th:style="'grid-column: ' + (${ci.index} + 2) + '; grid-row: 1;'">
            <span class="mx-floor" th:text="${c.floor()}">4F</span>
            <span class="tag" th:attr="data-cat=${c.category()}" th:text="${c.category()}">공연</span>
            <span class="mx-zone" th:text="${c.zone()}">캠퍼스 낭만존</span>
        </div>
        <!-- prep band (full width, above the hours) -->
        <div class="mx-band" style="grid-column: 1 / -1; grid-row: 2;"
             th:text="${brackets[0]}">08:00–11:00 현장 준비 및 사전 리허설</div>
        <!-- hour labels -->
        <div class="mx-time" th:each="h,hi : ${hours}"
             th:style="'grid-column: 1; grid-row: ' + (${hi.index} + 3) + ';'"
             th:text="${h} + ':00'">11:00</div>
        <!-- program cells -->
        <th:block th:each="c,ci : ${columns}">
            <div class="mx-cell" th:each="cell : ${c.cells()}" th:attr="data-cat=${c.category()}"
                 th:style="'grid-column: ' + (${ci.index} + 2) + '; grid-row: ' + ${cell.rowStart()} + ' / span ' + ${cell.rowSpan()} + ';'">
                <span class="mx-cell-time" th:text="${cell.time()}">11:00–17:00</span>
                <span class="mx-cell-item" th:each="it : ${cell.items()}" th:text="${it}">프로그램</span>
            </div>
        </th:block>
        <!-- teardown band (full width, below the hours) -->
        <div class="mx-band" th:style="'grid-column: 1 / -1; grid-row: ' + (${#lists.size(hours)} + 3) + ';'"
             th:text="${brackets[1]}">22:00–23:00 현장 정리 및 행사 종료</div>
    </div>
</div>
</body>
</html>
