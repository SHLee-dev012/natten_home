<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Zone cards for one festival day; slots are filtered to that day. -->
<ul th:fragment="zonePanel(zones, day)" class="zones daypanel" th:classappend="'daypanel-' + ${day}">
    <li class="zone" th:each="z : ${zones}">
        <div class="zone-head">
            <span class="floor" th:text="${z.floor()}">4F</span>
            <div class="zone-titles">
                <span class="tag" th:attr="data-cat=${z.category()}" th:text="${z.category()}">공연</span>
                <span class="zone-name" th:text="${z.zone()}">캠퍼스 낭만존</span>
            </div>
        </div>
        <ul class="slots">
            <li th:each="s : ${z.slots()}" th:if="${s.on(day)}">
                <span class="slot-time" th:text="${s.time()}">11:00–17:00</span>
                <span class="slot-content" th:text="${s.content()}">프로그램 내용</span>
            </li>
        </ul>
        <p class="zone-staff">
            <span>담당</span>
            <span th:text="${z.staff()}">심재욱, 김누림</span>
        </p>
    </li>
</ul>
</body>
</html>
