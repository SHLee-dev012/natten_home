<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${festival.name()} + ' — 홈'">notten 페스티벌</title>
    <link rel="stylesheet" th:href="@{/css/home.css}"/>
</head>
<body>
<div class="starfield" aria-hidden="true"></div>

<header class="nav">
    <a class="brand" href="/">
        <img class="brand-logo" th:src="@{/img/logo.png}" alt="낯텐"/>
    </a>
    <nav class="nav-links">
        <a href="#highlights">하이라이트</a>
        <a href="#archive">아카이브</a>
        <a href="/api/festival">API</a>
    </nav>
</header>

<main>
    <section class="hero">
        <div class="hero-copy">
            <p class="eyebrow" th:text="${festival.location()}">STRANGER UNIV. 10TH ANNIVERSARY</p>
            <h1 class="hero-title" th:text="${festival.name()}">낯선대학 10주년 축제</h1>
            <p class="hero-tagline" th:text="${festival.tagline()}">과거를 기록하고, 현재를 연결하고, 미래를 확장하는 축제</p>
            <div class="hero-meta">
                <span class="pill pill--accent" th:text="${festival.dateRange()}">9월 12일 – 13일</span>
                <span class="pill">SAT–SUN</span>
            </div>
        </div>
        <figure class="hero-poster">
            <img th:src="@{/img/poster.png}" th:alt="${festival.name()} + ' 포스터'"/>
        </figure>
    </section>

    <section id="highlights" class="highlights">
        <h2>하이라이트</h2>
        <ul class="grid">
            <li class="card" th:each="p : ${highlights}">
                <span class="tag" th:attr="data-cat=${p.category()}" th:text="${p.category()}">공연</span>
                <h3 th:text="${p.title()}">프로그램 제목</h3>
                <p class="meta">
                    <span th:text="${p.time()}">7/25 12:00</span>
                    <span class="dot">·</span>
                    <span th:text="${p.place()}">메인 스테이지</span>
                </p>
            </li>
        </ul>
    </section>

    <section id="archive" class="archive">
        <figure class="archive-poster">
            <img th:src="@{/img/poster-mono.png}" th:alt="${festival.name()} + ' 아카이브 포스터'"/>
        </figure>
        <div class="archive-copy">
            <p class="eyebrow">ARCHIVE</p>
            <h2>10년의 기록</h2>
            <p class="archive-lede">
                2016년 첫 회부터 지금까지, 낯선 이들이 만나 이어온 낯선대학 축제의 발자취입니다.
            </p>
            <ol class="timeline">
                <li th:each="e : ${archives}" th:classappend="${e.current()} ? 'is-current' : ''">
                    <span class="year" th:text="${e.year()}">2026</span>
                    <span class="badge" th:if="${e.current()}" th:text="${anniversary} + '주년 · 올해'">10주년 · 올해</span>
                </li>
            </ol>
        </div>
    </section>
</main>

<footer class="foot">
    <span th:text="${festival.name()} + ' · ' + ${festival.dateRange()}">notten 페스티벌</span>
    <span class="muted">notten-home · Spring Boot</span>
</footer>
</body>
</html>
