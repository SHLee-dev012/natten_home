<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="낯텐축제">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.45" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.32" cy="0.26" r="0.95">
      <stop offset="0" stop-color="#1b1f45"/>
      <stop offset="0.55" stop-color="#0f1230"/>
      <stop offset="1" stop-color="#090b18"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none"
        stroke="rgba(160,170,255,0.22)" stroke-width="4"/>

  <!-- primary 4-point sparkle -->
  <g filter="url(#glow)">
    <path d="M256 96
             Q296 216 416 256
             Q296 296 256 416
             Q216 296 96 256
             Q216 216 256 96 Z"
          fill="url(#acc)"/>
  </g>

  <!-- secondary small sparkle -->
  <path d="M388 132
           Q400 168 436 180
           Q400 192 388 228
           Q376 192 340 180
           Q376 168 388 132 Z"
        fill="#c4b5fd"/>
</svg>
