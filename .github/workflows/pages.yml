name: Deploy to GitHub Pages

# natten-home has no login/DB, so its rendered output is static — we render
# the app once in CI and publish the snapshot to GitHub Pages.
# (Pages source must be set to "GitHub Actions" in the repo settings.)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  # 경로 필터가 걸려 있으면 GitHub 은 "바뀐 파일"을 보고 실행 여부를 정한다.
  # 그래서 빈 커밋(--allow-empty)은 바뀐 파일이 0개라 아무 워크플로도 잡지
  # 못한다. 일시적 실패를 다시 돌릴 때는 Actions 에서 Re-run 하거나 아래
  # workflow_dispatch 로 직접 실행할 것.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build boot jar
        run: ./gradlew --no-daemon clean bootJar -x test

      - name: Render static snapshot
        run: |
          set -e
          java -jar build/libs/*.jar > app.log 2>&1 &
          APP_PID=$!
          # wait for the app to answer
          for i in $(seq 1 60); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done

          mkdir -p public/css public/js public/img public/api public/admin
          curl -s http://localhost:8080/ > public/index.html
          curl -s http://localhost:8080/admin > public/admin.html
          curl -s http://localhost:8080/api/festival > public/api/festival.json
          kill "$APP_PID" 2>/dev/null || true

          cp -r src/main/resources/static/css/. public/css/
          cp -r src/main/resources/static/js/. public/js/
          cp -r src/main/resources/static/img/. public/img/
          # 홈화면 아이콘과 매니페스트 (관리자 페이지 전용)
          cp -r src/main/resources/static/admin/. public/admin/
          touch public/.nojekyll
          # 커스텀 도메인 유지 (Actions 재배포 시 도메인 초기화 방지)
          echo "knotsun.kr" > public/CNAME
          # 관리자 페이지는 색인에서 뺀다. admin.html 의 robots 메타와 짝이다.
          printf 'User-agent: *\nDisallow: /admin.html\nDisallow: /admin/\n' > public/robots.txt

          # Make absolute asset paths relative so they resolve under the
          # /natten_home/ project subpath on GitHub Pages.
          for page in public/index.html public/admin.html; do
            sed -i 's#href="/css/#href="css/#g; s#href="/img/#href="img/#g; s#src="/js/#src="js/#g; s#src="/img/#src="img/#g; s#href="/api/festival"#href="api/festival.json"#g' "$page"
          done
          sed -i 's#url("/img/#url("../img/#g' public/css/home.css

          # Pages 는 css/js 에 cache-control: max-age=600 을 붙인다. 배포해도
          # 최대 10분 동안 브라우저가 옛 파일을 쓴다는 뜻이고, 그동안 고친 것이
          # 반영되지 않은 화면을 보게 된다. 주소 뒤에 커밋 해시를 달아 배포마다
          # 다른 주소가 되게 한다 — 새 배포는 즉시, 그 사이에는 캐시가 그대로 산다.
          V="${GITHUB_SHA:0:7}"
          for page in public/index.html public/admin.html; do
            sed -i "s#\(href=\"css/[A-Za-z0-9._-]*\.css\)\"#\1?v=$V\"#g; \
                    s#\(src=\"js/[A-Za-z0-9._-]*\.js\)\"#\1?v=$V\"#g" "$page"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
