name: Deploy to GitHub Pages

# natten-home has no login/DB, so its rendered output is static — we render
# the app once in CI and publish the snapshot to GitHub Pages.
# (Pages source must be set to "GitHub Actions" in the repo settings.)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build boot jar
        run: ./gradlew --no-daemon clean bootJar -x test

      - name: Render static snapshot
        run: |
          set -e
          java -jar build/libs/*.jar > app.log 2>&1 &
          APP_PID=$!
          # wait for the app to answer
          for i in $(seq 1 60); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done

          mkdir -p public/css public/js public/img public/api
          curl -s http://localhost:8080/ > public/index.html
          curl -s http://localhost:8080/api/festival > public/api/festival.json
          kill "$APP_PID" 2>/dev/null || true

          cp -r src/main/resources/static/css/. public/css/
          cp -r src/main/resources/static/js/. public/js/
          cp -r src/main/resources/static/img/. public/img/
          touch public/.nojekyll

          # Make absolute asset paths relative so they resolve under the
          # /natten_home/ project subpath on GitHub Pages.
          sed -i 's#href="/css/#href="css/#g; s#src="/js/#src="js/#g; s#src="/img/#src="img/#g; s#href="/api/festival"#href="api/festival.json"#g' public/index.html
          sed -i 's#url("/img/#url("../img/#g' public/css/home.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
